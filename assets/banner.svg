<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Atmaja Desna — web developer">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="1" stop-color="#1b2027"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#fade)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#e8a33d"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="120" fill="#e8a33d" font-size="17" font-weight="700" letter-spacing="5">PORTFOLIO</text>

    <text x="72" y="196" fill="#f5f6f8" font-size="64" font-weight="800" letter-spacing="-1.5">Atmaja Desna Adinata</text>

    <text x="72" y="246" fill="#9aa3ad" font-size="23">Web developer &amp; data — Surakarta, Indonesia</text>

    <g font-size="15" fill="#c3c9d1">
      <rect x="72" y="276" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="92" y="298">Laravel &amp; PHP</text>

      <rect x="282" y="276" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="302" y="298">JavaScript</text>

      <rect x="472" y="276" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="492" y="298">MySQL</text>

      <rect x="636" y="276" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="656" y="298">UI &amp; Frontend</text>
    </g>
  </g>

  <g transform="translate(1050, 60)" opacity="0.9">
    <rect x="0" y="0" width="150" height="150" rx="18" fill="none" stroke="#e8a33d" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M20 96 L50 66 L76 92 L108 60 L132 84" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="96" r="5" fill="#e8a33d"/>
    <circle cx="50" cy="66" r="5" fill="#e8a33d"/>
    <circle cx="76" cy="92" r="5" fill="#e8a33d"/>
    <circle cx="108" cy="60" r="5" fill="#e8a33d"/>
    <circle cx="132" cy="84" r="5" fill="#e8a33d"/>
